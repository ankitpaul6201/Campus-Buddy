<?xml version="1.0" encoding="utf-8"?>
<svg width="800px" height="800px" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g id="Stacked_Pages_3D_AllWhiteBorders">
    <!-- Backmost Page (3rd Page - White outline) -->
    <rect 
      x="12" 
      y="8" 
      width="64" 
      height="64" 
      rx="14" 
      ry="14" 
      fill="#1944F1" 
      stroke="#FFFFFF" 
      stroke-width="4" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Middle Page (2nd Page - White outline) -->
    <rect 
      x="18" 
      y="15" 
      width="64" 
      height="64" 
      rx="14" 
      ry="14" 
      fill="#1944F1" 
      stroke="#FFFFFF" 
      stroke-width="4" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Front Written Page (1st Page - White outline to separate from Middle Page) -->
    <rect 
      x="24" 
      y="22" 
      width="64" 
      height="64" 
      rx="14" 
      ry="14" 
      fill="#1944F1" 
      stroke="#FFFFFF" 
      stroke-width="4" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
    <!-- Text Lines inside Front Written Page -->
    <line x1="38" y1="44" x2="60" y2="44" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="38" y1="58" x2="72" y2="58" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
